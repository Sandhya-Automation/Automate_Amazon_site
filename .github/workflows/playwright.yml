name: Playwright Tests for 5th March

on:
  push:   # push, worklow_displatch, pull_request and achedule are all pre-defined keys
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:          ## to execut the testcase manually from pipeline
       # minutes hourofday dayofmonth month dayofweek

jobs:  # what to excute and setting software before excuting the code
  test:
    runs-on: ubuntu-latest      #which OS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4       #git cloning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test #to pass values run time- windows- set ${{url}} && mpx playwright test and for mac- ${{url}} npx playwright test

  # to set secret values- run- ${{vars.URL}} ${{secrets.pw}} npx playwright test
      - name: Upload Playwright Report (for Pages)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4