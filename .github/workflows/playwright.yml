name: Playwright Tests for 5th March
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:          ## to execut the testcase manually
 
 
jobs:
  test:
    runs-on: ubuntu-latest      #which OS
 
    steps:
      - name: Checkout Repository on git hub
        uses: actions/checkout@v4       #git cloning
 
 
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
 
      - name: Install Dependencies
        run: npm ci
 
      - name: Install playwright
        run: npm init playwright@latest
 
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
 
      - name: Run Playwright Tests
        run: npx playwright test
 
      - name: Upload Playwright Report (for Pages)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/
 
 
 
     
 
  deploy:
    needs: test
    runs-on: ubuntu-latest
 
    permissions:
      pages: write
      id-token: write
 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
 
      - name: Comment PR with Report Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ needs.test.result }}';
            const reportUrl = '${{ steps.deployment.outputs.page_url }}';
            const status = testResult === 'success' ? '✅ Tests Passed!' : '❌ Tests Failed!';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status}\n\n📊 View Playwright Report: ${reportUrl}`
            })
 